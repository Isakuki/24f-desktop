<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Kexlo</title>
<style>
  /* Kexlo splash (Windows and Mac): a small glass chip with the Kexlo mark and one thin line of light.
     Nothing heavy to draw, so it is on screen at once and gone the moment the workspace is ready. */
  :root { --red: #ff3b3b; --red-deep: #d81e2c; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }

  .chip {
    position: absolute; inset: 10px; border-radius: 22px; overflow: hidden;
    display: grid; place-items: center; align-content: center; gap: 22px;
    background: radial-gradient(100% 120% at 50% 0%, #1d0d10 0%, #0d0a0c 60%, #09080a 100%);
    box-shadow: 0 0 0 1px rgb(255 70 70 / 12%), 0 18px 40px -16px rgb(0 0 0 / 70%), inset 0 1px 0 rgb(255 255 255 / 5%);
    opacity: 0; transform: scale(.97); animation: in 360ms var(--ease) forwards;
    transition: opacity 200ms ease, transform 260ms var(--ease);
  }
  .out .chip { opacity: 0; transform: scale(1.02); }

  /* The Kexlo mark (mark-red.png: the white K with its red gem, centred in a 560 x 326 canvas); a soft red light under it. */
  .mark { position: relative; width: 124px; aspect-ratio: 560 / 326; opacity: 0; transform: translateY(4px); animation: rise 420ms var(--ease) 60ms forwards; }
  .mark img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 18px rgb(255 50 50 / 26%)); }
  .glow { position: absolute; left: 50%; top: 62%; width: 190px; height: 70px; translate: -50% -50%; z-index: -1; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(255 45 45 / 26%), transparent); filter: blur(8px); animation: breathe 2.4s ease-in-out infinite; }

  /* One hairline: light slides along it while loading, then it fills. */
  .line { position: relative; width: 96px; height: 2px; border-radius: 2px; overflow: hidden; background: rgb(255 255 255 / 7%); opacity: 0; animation: fade 300ms ease 160ms forwards; }
  .line i { position: absolute; inset: 0 auto 0 -45%; width: 45%; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--red)); box-shadow: 0 0 10px var(--red); animation: slide 1s cubic-bezier(.6, 0, .4, 1) infinite; }
  .done .line i { animation: none; left: 0; width: 100%; background: linear-gradient(90deg, var(--red-deep), var(--red)); transition: width 180ms var(--ease); }

  @keyframes in { to { opacity: 1; transform: none; } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes breathe { 50% { opacity: .55; } }
  @keyframes slide { to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
  <div class="chip">
    <div class="mark"><div class="glow"></div><img src="mark-red.png" alt="Kexlo"></div>
    <div class="line"><i></i></div>
  </div>
<script>
  // main.js calls these; status text is no longer shown (the line says enough).
  window.setStatus = () => {};
  window.finish = () => {
    document.body.classList.add("done");
    setTimeout(() => document.body.classList.add("out"), 120);
  };
</script>
</body>
</html>
