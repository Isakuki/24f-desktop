<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Kexlo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: grid; place-items: center; background: radial-gradient(90% 70% at 50% 0%, #2a0f13 0%, #0d0a0c 60%); color: #f6eeee; font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overflow: hidden; }
  main { display: grid; justify-items: center; gap: 18px; text-align: center; padding: 24px; animation: in 600ms cubic-bezier(.16, 1, .3, 1) both; }
  img { width: 150px; opacity: .9; filter: drop-shadow(0 10px 24px rgb(255 50 50 / 20%)); animation: breathe 3s ease-in-out infinite; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  p { font-size: 13.5px; line-height: 1.5; color: rgb(240 214 214 / 60%); max-width: 360px; }
  button { margin-top: 4px; height: 42px; padding: 0 22px; border: 0; border-radius: 999px; background: linear-gradient(180deg, #ff4646, #d81e2c); color: #fff; font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer; transition: transform 120ms ease, opacity 120ms ease; }
  button:hover { opacity: .9; } button:active { transform: scale(.96); }
  small { font-size: 11.5px; color: rgb(240 214 214 / 38%); font-variant-numeric: tabular-nums; }
  @keyframes in { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  @keyframes breathe { 50% { opacity: .6; } }
</style>
</head>
<body>
  <main>
    <img src="mark-red.png" alt="Kexlo">
    <h1>Can't reach Kexlo</h1>
    <p>Check your internet connection. Everything picks up where you left off once you're back online.</p>
    <button id="retry" type="button">Try again</button>
    <small id="note"></small>
  </main>
<script>
  const target = new URLSearchParams(location.search).get("to") || "https://app.kexlo.io/dashboard";
  const go = () => { if (/^https:\/\//.test(target)) location.replace(target); };
  document.getElementById("retry").onclick = go;
  window.addEventListener("online", go);
  let seconds = 10;
  const note = document.getElementById("note");
  setInterval(() => {
    seconds -= 1;
    if (seconds <= 0) { seconds = 10; if (navigator.onLine) go(); }
    note.textContent = navigator.onLine ? "Retrying in " + seconds + "s" : "Waiting for a connection";
  }, 1000);
</script>
</body>
</html>
